<!DOCTYPE html>
<html lang="id">
<head>
  <base href="/autotrip-checklist-web/">
  <meta charset="UTF-8">
  <!-- Semua berkas dari situs ini sendiri. Satu-satunya koneksi luar: alamat foto dari OpenStreetMap (Nominatim).
       'wasm-unsafe-eval' untuk CanvasKit; style inline dipakai mesin Flutter. Tanpa analytics/pelacak. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' blob: data: https://nominatim.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AutoTrip Checklist: checklist kondisi mobil untuk karyawan rental (versi website).">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E5631">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AutoTrip">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>AutoTrip Checklist</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F6F2; color: #1B1C1A; }
    @media (prefers-color-scheme: dark) { html, body { background: #121411; color: #E4E3DE; } }
    #memuat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; font: 16px/1.4 system-ui, -apple-system, sans-serif; text-align: center; padding: 16px; }
    #memuat img { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <div id="memuat">
    <img src="icons/Icon-192.png" alt="">
    <div>Memuat AutoTrip Checklist</div>
  </div>
  <noscript>AutoTrip Checklist membutuhkan JavaScript. Buka di Safari atau Chrome terbaru.</noscript>
  <script src="autotrip.js"></script>
  <script src="pwa.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
